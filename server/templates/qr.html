<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Expo Go QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { margin: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
  #qr { margin: 24px; }
  p { color: #555; font-size: 13px; text-align: center; max-width: 280px; }
  code { display: block; font-size: 10px; color: #999; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
  <div id="qr"></div>
  <p>Scan with <strong>Expo Go</strong> (Android) or your <strong>Camera app</strong> (iOS)</p>
  <code>exp://b3abbf01-7ae5-46ee-814f-dd5e404fdd42-00-29txdti8rzozq.worf.replit.dev</code>
  <script>
    new QRCode(document.getElementById("qr"), {
      text: "exp://b3abbf01-7ae5-46ee-814f-dd5e404fdd42-00-29txdti8rzozq.worf.replit.dev",
      width: 280,
      height: 280,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
